name: Download NPTEL Lectures

on:
  push:
    paths:
      - "input/test.txt"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Install FFmpeg
      # --------------------------------------------------
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # --------------------------------------------------
      # 5. Install Deno
      # --------------------------------------------------
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --------------------------------------------------
      # 6. Decrypt YouTube cookies
      # --------------------------------------------------
      - name: Decrypt YouTube cookies
        env:
          PASSPHRASE: ${{ secrets.YOUTUBE_COOKIES_PASSPHRASE }}

        run: |
          mkdir -p "$HOME/secrets"

          gpg \
            --quiet \
            --batch \
            --yes \
            --decrypt \
            --passphrase="$PASSPHRASE" \
            --output "$HOME/secrets/cookies.txt" \
            cookies.txt.gpg

          chmod 600 "$HOME/secrets/cookies.txt"

      # --------------------------------------------------
      # 7. Download NPTEL lectures
      # --------------------------------------------------
      - name: Download NPTEL lectures
        run: |
          python src/main.py

      # --------------------------------------------------
      # 8. Upload downloads as GitHub Artifact
      # --------------------------------------------------
      - name: Upload downloaded lectures
        uses: actions/upload-artifact@v4
        with:
          name: nptel-downloads
          path: downloads/
          if-no-files-found: warn

      # --------------------------------------------------
      # 9. Delete cookies
      # --------------------------------------------------
      - name: Delete cookies
        if: always()
        run: |
          rm -f "$HOME/secrets/cookies.txt"